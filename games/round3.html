<script>(function(){

const part=(id,x,y,w,h,tx,ty)=>({id,x,y,w,h,tx,ty});
const LEVELS=[
 {name:'先把路让开',hint:'虚线是缺口。挡路的零件也能沿箭头送走。',pieces:[part('A',40,204,50,26,291,204),part('B',185,193,26,49,185,94),part('C',113,190,26,54,113,332)]},
 {name:'别先封住横梁',hint:'装好的零件会固定；让还没走的零件先过。',pieces:[part('A',40,211,50,26,291,211),part('B',181,91,26,55,181,200),part('C',117,196,26,52,117,94),part('D',61,156,86,25,267,156)]},
 {name:'一根长梁，两条路',hint:'长竖梁会横跨两条路线，先让两边都通过。',pieces:[part('A',40,211,50,26,291,211),part('B',187,375,26,112,187,200),part('C',117,196,26,52,117,94),part('D',61,156,86,25,267,156),part('E',40,296,50,26,291,296),part('F',245,350,26,48,245,267)]},
 {name:'把最后的空隙留住',hint:'缺口会变成实体。先看谁还要借这条路。',pieces:[part('A',35,230,53,26,289,230),part('B',190,89,26,60,190,213),part('C',113,216,26,46,113,93),part('D',68,168,79,25,275,168),part('E',35,345,51,26,290,345),part('F',242,422,26,47,242,323),part('G',34,395,70,25,180,395),part('H',150,333,26,46,150,438)]}
];
const intersects=(a,b)=>a.x<b.x+b.w-0.01&&a.x+a.w>b.x+0.01&&a.y<b.y+b.h-0.01&&a.y+a.h>b.y+0.01;
const copyRect=p=>({x:p.x,y:p.y,w:p.w,h:p.h});
const center=p=>({x:p.x+p.w/2,y:p.y+p.h/2});
function create(env){
 const cfg=LEVELS[Math.min(LEVELS.length-1,Math.max(0,env.level||0))];
 const pieces=cfg.pieces.map(p=>({...p,start:{x:p.x,y:p.y},installed:false}));
 let status='playing',motion=null,time=0,steps=[],attempts=[],lastMessage='',noticeTime=0,highlight=null,blockedClicks=0,deadlockDelay=0,outcomeSent=false,particles=[];
 const sound=(t,v=1,p=1)=>env.sound&&env.sound(t,v,p);
 const path=p=>({x:Math.min(p.x,p.tx),y:Math.min(p.y,p.ty),w:Math.abs(p.tx-p.x)+p.w,h:Math.abs(p.ty-p.y)+p.h});
 const blockers=p=>pieces.filter(q=>q!==p&&intersects(path(p),q)).map(q=>({id:q.id,kind:q.installed?'installed':'source',rect:copyRect(q)}));
 const pending=()=>pieces.filter(p=>!p.installed);
 const permanentBlocks=()=>pending().flatMap(p=>blockers(p).filter(b=>b.kind==='installed').map(b=>({piece:p.id,blocker:b.id})));
 function emitParticles(p){const c=center(p);for(let i=0;i<12;i++){const a=i*2.399;particles.push({x:c.x,y:c.y,vx:Math.cos(a)*(20+i*3),vy:Math.sin(a)*(20+i*3),life:.5});}}
 function inspectEnd(){
  if(!pending().length){status='won';sound('win',.8);if(!outcomeSent){outcomeSent=true;env.onComplete({message:'每个缺口都补好了。',steps:steps.slice(),blockedClicks,seconds:+time.toFixed(2)});}return;}
  const permanent=permanentBlocks();
  if(permanent.length){const h=permanent[0];highlight={piece:h.piece,blocker:h.blocker,permanent:true};lastMessage=h.blocker+' 已固定，挡住了 '+h.piece;noticeTime=3.2;}
  if(pending().every(p=>blockers(p).length>0)){
   status='blocked';deadlockDelay=1.35;const h=permanent[0];
   if(h){highlight={piece:h.piece,blocker:h.blocker,permanent:true};lastMessage=h.blocker+' 装早了，封住了 '+h.piece+' 的路';}

  }

  if(!p)return;
  const bs=blockers(p);attempts.push({id:p.id,at:+time.toFixed(3),accepted:bs.length===0,blockers:bs.map(b=>({id:b.id,kind:b.kind}))});
  if(bs.length){blockedClicks++;highlight={piece:p.id,blocker:bs[0].id,permanent:bs[0].kind==='installed'};lastMessage=bs[0].kind==='installed'?bs[0].id+' 已装好，'+p.id+' 过不去了':'先让 '+bs[0].id+' 走，'+p.id+' 才能通过';noticeTime=2.5;sound('hit',.32,.9);return;}
  highlight=null;lastMessage='';noticeTime=0;

   p.x=motion.from.x+(p.tx-motion.from.x)*e;p.y=motion.from.y+(p.ty-motion.from.y)*e;
   if(u===1){p.x=p.tx;p.y=p.ty;p.installed=true;steps.push(p.id);motion=null;emitParticles(p);sound('collect',.65,.92+steps.length*.06);inspectEnd();}

  ctx.moveTo(cx+dx*len/2-dx*5+dy*5,cy+dy*len/2-dy*5-dx*5);ctx.lineTo(cx+dx*len/2,cy+dy*len/2);ctx.lineTo(cx+dx*len/2-dx*5-dy*5,cy+dy*len/2-dy*5+dx*5);ctx.stroke();
 }
 function render(ctx){
  ctx.save();ctx.fillStyle=PAPER;ctx.fillRect(0,0,390,560);
  ctx.fillStyle=INK;ctx.font='600 17px sans-serif';ctx.fillText('把零件送进虚线缺口',19,27);
  ctx.fillStyle='#748478';ctx.font='12px sans-serif';ctx.fillText('装好就固定，别封住后面的路',19,48);
  ctx.fillStyle=MINT;ctx.font='700 22px sans-serif';ctx.textAlign='right';ctx.fillText(steps.length+' / '+pieces.length,370,31);ctx.textAlign='left';
  ctx.strokeStyle='#d8dfd4';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(19,64);ctx.lineTo(371,64);ctx.stroke();
  ctx.fillStyle='#dce0d6';for(let y=86;y<490;y+=23)for(let x=24;x<376;x+=23){ctx.beginPath();ctx.arc(x,y,.9,0,Math.PI*2);ctx.fill();}
  // Target apertures stay visible from the beginning and have exactly the piece's footprint.
  for(const p of pieces){
   if(p.installed)continue;
   ctx.save();ctx.setLineDash([4,4]);roundRect(ctx,p.tx,p.ty,p.w,p.h,6,'#e6eee4',GHOST,1.8);ctx.setLineDash([]);
   ctx.fillStyle='#79a08a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='600 13px sans-serif';ctx.fillText(p.id,p.tx+p.w/2,p.ty+p.h/2);ctx.restore();
   // Sparse rail dots connect the matching silhouettes without becoming solid obstacles.
   const c=center(p),t={x:p.tx+p.w/2,y:p.ty+p.h/2};ctx.save();ctx.strokeStyle='#94a99935';ctx.setLineDash([2,8]);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(t.x,t.y);ctx.stroke();ctx.restore();
  }
  if(highlight&&noticeTime>0){const p=pieces.find(x=>x.id===highlight.piece),b=pieces.find(x=>x.id===highlight.blocker);if(p&&b){
   const c=center(p),t={x:p.tx+p.w/2,y:p.ty+p.h/2};ctx.save();ctx.strokeStyle=highlight.permanent?RED:'#d49450';ctx.globalAlpha=.65;ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(t.x,t.y);ctx.stroke();ctx.setLineDash([]);roundRect(ctx,b.x-5,b.y-5,b.w+10,b.h+10,10,null,highlight.permanent?RED:'#d49450',2.5);ctx.restore();}}
  for(const p of pieces){
   const active=motion&&motion.id===p.id;const accent=highlight&&noticeTime>0&&highlight.blocker===p.id?RED:p.installed?MINT:CORAL;
   roundRect(ctx,p.x+1.5,p.y+3.5,p.w,p.h,7,'#24332d15');roundRect(ctx,p.x,p.y,p.w,p.h,7,p.installed?'#a9c8b6':accent,p.installed?'#618b74':'#a65345',1.6);
   ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x+7,p.y+4);ctx.lineTo(p.x+p.w-7,p.y+4);ctx.stroke();ctx.restore();
   const c=center(p);ctx.fillStyle=p.installed?'#355c47':'#fff6eb';ctx.font='700 13px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
   if(p.installed){ctx.fillText(p.id,c.x,c.y);ctx.strokeStyle='#456d54';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(p.x+4,p.y+5);ctx.lineTo(p.x+7,p.y+8);ctx.lineTo(p.x+12,p.y+3);ctx.stroke();}
   else{const horizontal=p.tx!==p.start.x;ctx.fillText(p.id,c.x-(horizontal?12:0),c.y-(horizontal?0:12));arrow(ctx,p,'#fff6eb');}
   if(active){ctx.save();ctx.globalAlpha=.13;roundRect(ctx,p.x-3,p.y-3,p.w+6,p.h+6,10,CORAL);ctx.restore();}
   ctx.textBaseline='alphabetic';ctx.textAlign='left';
  }
  for(const p of particles){ctx.globalAlpha=p.life/.5;ctx.fillStyle=MINT;ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;

  ctx.restore();
 }
 return {update,render,input(type,p){if(type==='down')click(p.x,p.y);},getState(){return {status,state:motion?'moving':status,level:env.level||0,seconds:+time.toFixed(3),steps:steps.slice(),installed:steps.length,total:pieces.length,moving:motion?{...motion}:null,blockingReason:lastMessage,permanentBlocks:permanentBlocks(),blockedClicks,attempts:attempts.map(a=>({...a})),pieces:pieces.map(p=>({...copyRect(p),id:p.id,center:center(p),target:{x:p.tx,y:p.ty,w:p.w,h:p.h},direction:{x:Math.sign(p.tx-p.start.x),y:Math.sign(p.ty-p.start.y)},installed:p.installed,clickable:!p.installed&&!motion&&status==='playing',canMove:!p.installed&&blockers(p).length===0,blockers:p.installed?[]:blockers(p)}))};},destroy(){status='destroyed';particles=[];motion=null;}};

})();

<script>(()=>{'use strict';
const C={ink:'#173f36',mint:'#b7dec9',green:'#527c64',coral:'#eb806e',light:'#f9e6d5',cream:'#f4f1e9',rope:'#3b715f',muted:'#789486'};
const layouts=[
 {name:'挤进小盘子',hint:'点开毛线环，观察哪里会鼓起来。',x:155,offsets:[-45,45],r:[15,15],targets:[32,30],wedge:{a:90,b:160,ga:14,gb:35},gates:[],plate:[120,280]},
 {name:'窄口',hint:'鼓起来的部分，会被窄口挡住。',x:178,offsets:[-68,0,68],r:[15,15,15],targets:[32,30,32],wedge:{a:90,b:170,ga:10,gb:35.6},gates:[{a:265,b:273,gap:22}],plate:[127,342]},
 {name:'两道窄口',hint:'每次松绑后，看看各段现在到了哪里。',x:135,offsets:[-52,0,52],r:[14,14,14],targets:[34,24,34],wedge:{a:120,b:190,ga:14,gb:24.5},gates:[{a:102,b:108,gap:20},{a:275,b:283,gap:26}],plate:[176,358]}
];
const Y=286,EPS=.002;
function capsule(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function forbidden(radius,ob){
 if(ob.type==='gate'){if(radius<=ob.gap)return null;const d=Math.sqrt(radius*radius-ob.gap*ob.gap);return[ob.a-d,ob.b+d];}
 if(radius<=ob.ga)return null;const s=(ob.gb-ob.ga)/(ob.b-ob.a),n=Math.sqrt(1+s*s),d=Math.sqrt(radius*radius-ob.ga*ob.ga);let right;
 if(radius<ob.ga*n)right=ob.a+d;else if(radius<=ob.gb*n)right=ob.a+(radius*n-ob.ga)/s;else right=ob.b+Math.sqrt(radius*radius-ob.gb*ob.gb);

}
function intervals(rs,L){const a=[];for(let i=0;i<rs.length;i++)for(const ob of L.obstacles){const z=forbidden(rs[i],ob);if(z)a.push([z[0]-L.offsets[i],z[1]-L.offsets[i]]);}a.sort((x,y)=>x[0]-y[0]);const m=[];for(const z of a){const last=m[m.length-1];if(last&&z[0]<=last[1]+EPS)last[1]=Math.max(last[1],z[1]);else m.push([...z]);}return m;}

 for(const [a,z]of old){if(z<=oldX+EPS*3)lo=Math.max(lo,z);else if(a>=oldX-EPS*3)hi=Math.min(hi,a);else return null;}

 const neo=intervals(newR,L),valid=v=>v>=lo-EPS&&v<=hi+EPS&&!neo.some(([a,b])=>v>a-EPS/4&&v<b+EPS/4);
 const candidates=[oldX,lo,hi];for(const[a,b]of neo)candidates.push(a-EPS,b+EPS);
 let best=null,dist=Infinity;for(const v of candidates)if(valid(v)&&Math.abs(v-oldX)<dist){best=v;dist=Math.abs(v-oldX);}return best;
}
function create(env){const src=layouts[Math.min(layouts.length-1,env.level||0)],L={...src,obstacles:[{...src.wedge,type:'wedge'},...src.gates.map(g=>({...g,type:'gate'}))]},rings=L.offsets.map((offset,i)=>({id:['tail','middle','head'][L.offsets.length===2?i*2:i],offset,r:L.r[i],target:L.targets[i],open:false,blocked:false,pulse:0}));let x=L.x,status='playing',active=-1,time=0,settle=0,feedback='',feedbackT=0,threads=[],events=[],contacts=[],lastDx=0,notice='',completeCalled=false;
 const sound=(t,n=1,p=1)=>env.sound?.(t,n,p);

<script>(()=>{'use strict';
